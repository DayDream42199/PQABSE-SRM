# Users registered in the demo.
user.Alice.identity_secret=101
user.Alice.attributes=CPE,Smart
user.Bob.identity_secret=343
user.Bob.attributes=CPE,Smart,Asian

# The paper models a data owner (DO). Here we keep that owner as a registered user GID.
# Supported policy expression forms:
#   AND(expr, expr, ...)
#   OR(expr, expr, ...)
#   THRESHOLD(k, expr, expr, ...)
# Bare identifiers such as CPE or Smart are treated as leaf attributes.
bundle.demo1.data_owner_gid=Alice
bundle.demo1.plaintext=hello_pq_world
bundle.demo1.keywords=hello,pq
bundle.demo1.policy=AND(CPE,Smart)


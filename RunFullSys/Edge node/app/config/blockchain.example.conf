# Copy this file to config/blockchain.local.conf and fill in the deployed contract address.
# Environment variables still override these values if you set them.
# This template assumes Anvil is running on another device, not this machine.
# Replace the host/IP below with the remote machine's reachable address.
# If that Anvil instance is restarted or redeployed, update rpc_url,
# contract_address, and possibly private_key too.
# The private_key should be the owner/deployer key for RootRegistry.sol.
# In a default Anvil session, you can copy it from the account list printed
# when `anvil` starts, or use the same key you passed to `forge create`.

rpc_url=http://REMOTE_HOST_OR_IP:8545
contract_address=PASTE_DEPLOYED_ADDRESS_HERE
private_key=PASTE_OWNER_PRIVATE_KEY_HERE
# Optional:
# cast_bin=C:\Users\YOUR_USER\.foundry\bin\cast.exe
